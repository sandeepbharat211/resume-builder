{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card border-0 shadow text-center p-5">
      <div style="font-size:4rem;">🗑️</div>
      <h4 class="fw-bold text-danger mt-3">{{ title }}</h4>
      <p class="text-muted">Are you sure you want to delete <strong>"{{ item }}"</strong>? This cannot be undone.</p>
      <form method="POST">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-3 mt-4">
          <button type="submit" class="btn btn-danger btn-lg px-5"><i class="bi bi-trash me-2"></i>Yes, Delete</button>
          <a href="{% url 'resume_detail' back_id %}" class="btn btn-secondary btn-lg px-5">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
