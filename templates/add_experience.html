{% extends 'base.html' %}
{% block title %}Add Section{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-8">
  <div class="card shadow border-0 rounded-4">
    <div class="card-header bg-primary text-white py-3 rounded-top"><h5 class="mb-0 fw-bold">Add Details</h5></div>
    <div class="card-body p-4">
      <form method="POST">{% csrf_token %}
        {% for field in form %}<div class="mb-3"><label class="form-label fw-semibold">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small class="text-muted">{{ field.help_text }}</small>{% endif %}{% if field.errors %}<div class="text-danger small mt-1">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
        <div class="d-flex gap-3 mt-4">
          <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save me-1"></i>Save</button>
          <a href="{% url 'resume_detail' resume.id %}" class="btn btn-secondary px-4">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div></div>
{% endblock %}
